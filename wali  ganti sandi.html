<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wali Ganti Sandi - SIPENA Muhammadiyah</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
<header>
 <b>
  <img class="site-brand-logo" src="/assets/logo-muhammadiyah.png" alt="">
  SIPENA Muhammadiyah
 </b>
 <span>
  Wali Aisyah
  <button>
   Keluar
  </button>
 </span>
</header>

<main>
 <div class="c" style="max-width:420px;margin:auto">
  <h3>Ganti kata sandi</h3>

  <p>
   Demi keamanan, ganti kata sandi awal sebelum melanjutkan.
  </p>

  <form>
   <div class="password-field">
    <input
      minlength="4"
      name="p"
      placeholder="Kata sandi baru (min. 4 karakter)"
      required
      type="password"
    >

    <button
      type="button"
      class="password-toggle"
      aria-label="Tampilkan kata sandi"
      aria-pressed="false"
    >
     <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
      <circle cx="12" cy="12" r="3"/>
     </svg>
    </button>
   </div>

   <button class="p">
    Simpan
   </button>
  </form>
 </div>
</main>
</div>

<script>
document.querySelectorAll('.password-toggle').forEach(function(button) {
  button.addEventListener('click', function() {

    var input = button.parentElement.querySelector('input');
    var visible = input.type === 'text';

    input.type = visible ? 'password' : 'text';

    button.setAttribute(
      visible ? 'Tampilkan kata sandi' : 'Sembunyikan kata sandi'
    );

    button.setAttribute('aria-pressed', String(!visible));

    button.innerHTML = visible
      ? '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>'
      : '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 3 21 21M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4-.8"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';

  });
});
</script>

<script src="/public/js/app.js"></script>

</body>
</html>
